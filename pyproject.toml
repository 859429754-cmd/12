[project]
name = "ai-quant-trader"
version = "0.1.0"
description = "Async AI-driven crypto quant trading system for Gate.io USDT perpetuals."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9",
    "ccxt>=4.0",
    "pandas>=2.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "requests>=2.31",
    "Pillow>=10.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
